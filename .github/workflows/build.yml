# Every push and pull request: run the self-test in headless Blender and build the extension zip.
# A version tag (v1.4.0 ...): also publish a GitHub release with the zip and index.json. Blender reads
# index.json as a remote extension repository from
#   https://github.com/WasifSheikh/BlenderAddon_Building_Generator/releases/latest/download/index.json
# so every artist who added that URL gets the new version offered as an update.
name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  BLENDER_VERSION: "5.2.3"

jobs:
  build:
    name: Self-test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender ${{ env.BLENDER_VERSION }}
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          curl -fsSL "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          mkdir -p ~/blender
          tar -xf /tmp/blender.tar.xz -C ~/blender --strip-components=1

      - name: Install the libraries Blender needs
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            libx11-6 libxext6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxcursor1 libxinerama1 libxrandr2 \
            libxkbcommon0 libxkbcommon-x11-0 libsm6 libice6 libgl1 libegl1 libwayland-client0 libwayland-egl1

      - name: Self-test
        run: ~/blender/blender --background --factory-startup --python-exit-code 1 --python tools/ci_selftest.py

      - name: Build the extension zip
        run: |
          mkdir -p dist
          ~/blender/blender --factory-startup --command extension build --source-dir aa_building_generator --output-dir dist

      - name: Validate the zip
        run: ~/blender/blender --factory-startup --command extension validate dist/*.zip

      - name: Extension repository index
        run: ~/blender/blender --factory-startup --command extension server-generate --repo-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: |
            dist/*.zip
            dist/index.json
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: extension
          path: dist

      - name: Check the version and collect the release notes
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/index.json --verify-tag \
            --title "AA Building Generator ${GITHUB_REF_NAME#v}" --notes-file notes.md